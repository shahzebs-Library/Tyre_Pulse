name: Build and Submit Native Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

jobs:
  build:
    name: Build & Sign Native AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        working-directory: tyre_pulse_app
        run: chmod +x gradlew

      - name: Build Release Bundle (AAB)
        working-directory: tyre_pulse_app
        run: ./gradlew bundleRelease

      - name: Sign Android App Bundle (AAB)
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: tyre_pulse_app/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-app-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Publish to Google Play (Internal Track)
        if: startsWith(github.ref, 'refs/tags/native-v') || github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          packageName: com.shahzebrahman.tyrepulseinspector
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal
          status: completed
