name: tyre_pulse
description: Tyre Pulse field application for Android and iOS.
publish_to: "none"

# The Android versionCode is set by CI. Read docs/BOOTSTRAP.md before changing
# this by hand: the production listing already has a version code and Play
# rejects a lower one (spec section 69).
version: 0.1.0+3

environment:
  # Deliberately broad. CI pins the real SDK by using the Flutter stable
  # channel; a narrow floor here only breaks a contributor on a slightly older
  # stable. Every dependency states its own constraint and pub checks those.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State and navigation (spec sections 4 and 5) ---
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0

  # --- Backend. There is no application server: PostgREST, RPC and Edge
  # Functions only. See docs/flutter-migration/02-backend-table-rpc-map.md ---
  supabase_flutter: ^2.17.2

  # --- Offline-first local store (spec section 11) ---
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # --- Platform services ---
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.9

  # --- Observability (spec section 59) ---
  sentry_flutter: ^9.27.0

  # --- Utilities ---
  uuid: ^4.6.0
  intl: ^0.20.2

  # --- Inspections (Phase 5): photo capture, GPS and signature capture.
  # image_picker resizes/compresses on the way out (maxWidth/maxHeight/
  # imageQuality), which is what keeps a 13-position vehicle's photo set off
  # the out-of-memory path this codebase has already named as a documented
  # production defect class - see `inspection_photo_capture.dart`. geolocator
  # owns its own runtime permission prompt, so no separate permission_handler
  # dependency is needed for the one permission this phase asks for.
  # signature is a real drawing surface exporting both a PNG and raw stroke
  # points - see `inspection_signature_pad.dart` for why both are kept.
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  signature: ^5.5.0

  # --- Vehicle diagram body artwork (tyre diagram redesign). Renders the
  # real per-vehicle-class SVG bodies under assets/vehicle_diagram/ - see
  # `tyre_body_painter.dart`'s library comment for why the wheels themselves
  # stay a `CustomPainter` (status colour must keep following
  # `TpPalette.forStatus`, not a fixed hex palette baked into an asset). ---
  flutter_svg: ^2.3.0

  # Packages for later phases (barcode scanner, PDF, sharing) are added at
  # the phase that needs them. Spec section 64: do not add a package to
  # shorten five lines.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/vehicle_diagram/
