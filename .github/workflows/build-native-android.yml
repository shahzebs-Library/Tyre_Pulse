name: Build and Submit Native Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Native AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate and Commit Keystore (if missing)
        id: load_keystore
        working-directory: tyre_pulse_app
        run: |
          if [ ! -f release.jks ]; then
            echo "Generating fresh release keystore..."
            keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias tyre-pulse-key -storepass tyre_pulse_pass -keypass tyre_pulse_pass -dname "CN=TyrePulse, O=TyrePulse, C=US"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release.jks
            git commit -m "chore: add default release keystore for testing builds [skip ci]"
            git push origin HEAD:main || echo "Push failed (possibly due to branch protection), continuing build using local generated key."
          else
            echo "Release keystore already exists."
          fi
          
          KEYSTORE_BASE64=$(base64 -w 0 release.jks)
          echo "keystore_base64=$KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"

      - name: Make Gradle Wrapper Executable
        working-directory: tyre_pulse_app
        run: chmod +x gradlew

      - name: Build Release Bundle (AAB)
        working-directory: tyre_pulse_app
        run: ./gradlew bundleProdRelease

      - name: Sign Android App Bundle (AAB)
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: tyre_pulse_app/app/build/outputs/bundle/prodRelease
          signingKeyBase64: ${{ steps.load_keystore.outputs.keystore_base64 }}
          alias: tyre-pulse-key
          keyStorePassword: tyre_pulse_pass
          keyPassword: tyre_pulse_pass


      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-app-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Publish to Google Play (Internal Track)
        if: startsWith(github.ref, 'refs/tags/native-v') || github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          # NOTE: This is the NATIVE app — separate listing from the production Expo app
          # Production app ID: com.shahzebrahman.tyrepulseinspector  (DO NOT TOUCH)
          # Native app ID:     com.shahzebrahman.tyrepulse.native     (this workflow)
          packageName: com.shahzebrahman.tyrepulse.native
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal
          status: completed

