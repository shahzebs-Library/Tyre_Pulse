name: Codex Dart Format Patch

on:
  pull_request:
    paths:
      - "tyre_pulse_flutter/**"
      - ".github/workflows/codex-dart-format-patch.yml"

jobs:
  format_patch:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: tyre_pulse_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Emit canonical format patch
        run: |
          dart format \
            lib/features/assets/presentation/vehicle_detail_screen.dart \
            lib/features/inspections/presentation/new_inspection_screen.dart \
            lib/features/tyre_diagram/presentation/tyre_body_painter.dart \
            lib/features/tyre_diagram/presentation/tyre_diagram_board.dart \
            lib/features/tyre_diagram/presentation/vehicle_tyre_diagram.dart \
            lib/features/tyre_exchange/presentation/tyre_replacement_screen.dart \
            lib/features/tyre_exchange/presentation/widgets/tyre_replacement_position_picker.dart \
            test/features/assets/presentation/vehicle_detail_screen_test.dart \
            test/features/inspections/presentation/new_inspection_root_responsive_test.dart \
            test/features/tyre_diagram/presentation/tyre_diagram_board_test.dart \
            test/features/tyre_diagram/presentation/vehicle_tyre_diagram_test.dart \
            test/features/tyre_exchange/presentation/tyre_replacement_position_picker_test.dart
          git diff --binary > format.patch
          echo "PATCH_B64_START"
          base64 -w 0 format.patch
          echo
          echo "PATCH_B64_END"
