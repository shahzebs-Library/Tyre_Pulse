<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ashok Leyland body art (red/white AL heavy truck). Ported verbatim from
  `mobile/components/VehicleTyreDiagram.tsx`'s `AshokLeylandBody()`. viewH
  305 -> viewBox height 315, matching `kTyreDiagramLayouts['Ashok Leyland']`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 315">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="alCab" cx="48%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <linearGradient id="alHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="alStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f0d1c" />
      <stop offset="30%" stop-color="#C41E3A" />
      <stop offset="50%" stop-color="#E8192C" />
      <stop offset="70%" stop-color="#C41E3A" />
      <stop offset="100%" stop-color="#7f0d1c" />
    </linearGradient>
    <linearGradient id="alCargo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="15%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="alBadge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8192C" />
      <stop offset="100%" stop-color="#7f0d1c" />
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="298" rx="80" ry="10" fill="#000000" fill-opacity="0.28" />

  <!-- Cab - white -->
  <path d="M 68,14 Q 56,14 55,27 L 53,112 L 53,128 L 147,128 L 147,112 L 145,27 Q 144,14 132,14 Z"
    fill="url(#alCab)" />

  <!-- Front bumper - red AL style -->
  <rect x="56" y="5" width="88" height="13" rx="4" fill="url(#alStripe)" />
  <rect x="62" y="7" width="76" height="7" rx="3" fill="url(#chrome)" />

  <!-- Headlights - round style (AL signature) -->
  <ellipse cx="66" cy="12" rx="12" ry="9" fill="url(#headlight)" />
  <ellipse cx="134" cy="12" rx="12" ry="9" fill="url(#headlight)" />
  <ellipse cx="66" cy="12" rx="7" ry="5.5" fill="#fde047" opacity="0.7" />
  <ellipse cx="134" cy="12" rx="7" ry="5.5" fill="#fde047" opacity="0.7" />
  <rect x="57" y="20" width="86" height="2.5" rx="1" fill="#E8192C" opacity="0.9" />

  <!-- Hood - white -->
  <rect x="58" y="23" width="84" height="44" rx="4" fill="url(#alHood)" />
  <line x1="100" y1="25" x2="100" y2="66" stroke="#e2e8f0" stroke-width="1" opacity="0.8" />
  <rect x="70" y="30" width="60" height="4" rx="2" fill="#e2e8f0" opacity="0.6" />
  <rect x="70" y="40" width="60" height="4" rx="2" fill="#e2e8f0" opacity="0.6" />
  <rect x="70" y="50" width="60" height="4" rx="2" fill="#e2e8f0" opacity="0.6" />

  <!-- AL badge on hood - circular logo -->
  <circle cx="100" cy="44" r="12" fill="url(#alBadge)" />
  <circle cx="100" cy="44" r="12" fill="none" stroke="#fca5a5" stroke-width="0.8" />
  <text x="100" y="41" text-anchor="middle" font-size="6" font-weight="900"
    fill="#ffffff" letter-spacing="0.5px">AL</text>
  <text x="100" y="51" text-anchor="middle" font-size="2.8" fill="#fca5a5"
    letter-spacing="0.2px" font-weight="600">ASHOK LEYLAND</text>

  <!-- Windshield -->
  <path d="M 61,67 L 139,67 L 135,85 L 65,85 Z" fill="url(#glassGrad)" />
  <path d="M 66,68 L 112,68 L 109,78 L 69,78 Z" fill="url(#glassReflect)" opacity="0.5" />
  <line x1="76" y1="83" x2="97" y2="69" stroke="#475569" stroke-width="0.8" opacity="0.6" />
  <line x1="124" y1="83" x2="103" y2="69" stroke="#475569" stroke-width="0.8" opacity="0.6" />

  <!-- Cab interior -->
  <rect x="57" y="85" width="86" height="40" rx="3" fill="#e2e8f0" />
  <rect x="64" y="89" width="18" height="14" rx="3" fill="#cbd5e1" />
  <rect x="118" y="89" width="18" height="14" rx="3" fill="#cbd5e1" />
  <circle cx="80" cy="114" r="8" fill="none" stroke="#334155" stroke-width="2.5" />
  <circle cx="80" cy="114" r="2.5" fill="#334155" />

  <!-- Red AL brand stripe on cab bottom -->
  <rect x="57" y="120" width="86" height="9" fill="url(#alStripe)" />
  <text x="100" y="126.5" text-anchor="middle" font-size="4" font-weight="800"
    fill="#ffffff" letter-spacing="0.4px">ASHOK LEYLAND &#183; ECOMET</text>

  <!-- Chassis -->
  <rect x="67" y="129" width="11" height="158" fill="#334155" />
  <rect x="122" y="129" width="11" height="158" fill="#334155" />
  <rect x="67" y="145" width="66" height="6" fill="#475569" />
  <rect x="67" y="190" width="66" height="6" fill="#475569" />
  <rect x="67" y="235" width="66" height="6" fill="#475569" />

  <!-- Cargo box - white with red stripes -->
  <rect x="57" y="129" width="86" height="152" rx="3" fill="url(#alCargo)" />
  <rect x="57" y="129" width="5" height="152" fill="#C41E3A" opacity="0.8" rx="1" />
  <rect x="138" y="129" width="5" height="152" fill="#C41E3A" opacity="0.8" rx="1" />
  <line x1="59" y1="148" x2="141" y2="148" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="175" x2="141" y2="175" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="202" x2="141" y2="202" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="229" x2="141" y2="229" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="256" x2="141" y2="256" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <circle cx="100" cy="200" r="14" fill="url(#alBadge)" opacity="0.9" />
  <circle cx="100" cy="200" r="14" fill="none" stroke="#fca5a5" stroke-width="0.8" />
  <text x="100" y="197" text-anchor="middle" font-size="7" font-weight="900" fill="#ffffff">AL</text>
  <text x="100" y="207" text-anchor="middle" font-size="3" fill="#fca5a5" letter-spacing="0.2px">ASHOK LEYLAND</text>

  <!-- Rear bumper -->
  <rect x="58" y="281" width="84" height="11" rx="3" fill="url(#alStripe)" />
  <rect x="60" y="282" width="22" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="118" y="282" width="22" height="7" rx="2" fill="url(#brakeLight)" />

  <!-- Exhaust -->
  <circle cx="55" cy="268" r="3.5" fill="#374151" stroke="#1f2937" stroke-width="0.8" />
  <circle cx="55" cy="268" r="1.8" fill="#111827" />

  <!-- Mirrors - white -->
  <rect x="37" y="54" width="17" height="10" rx="3" fill="#e2e8f0" stroke="#C41E3A" stroke-width="1" />
  <rect x="146" y="54" width="17" height="10" rx="3" fill="#e2e8f0" stroke="#C41E3A" stroke-width="1" />
</svg>
