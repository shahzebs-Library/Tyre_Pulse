name: OTA Update (EAS Update)

# Pushes a JS-only over-the-air update to all devices already running the
# current app version — no Play Store, no install required on the user's phone.
#
# Trigger: manually (Actions -> Run workflow).
# Required secret: EXPO_TOKEN (expo.dev -> Account -> Access tokens)

# Expo store BUILDS stay retired (2026-09-27, Flutter is the mobile path), but the
# owner re-enabled OTA hotfixes for the Expo app still in production (2026-10-12).
# `source_ref` must be a branch cut from the commit the installed binary was built
# from (1.6.0 = 6c27046), so an update carries only the intended fix. Publishing
# from main would ship every later, device-untested mobile change.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Short release note shown in the EAS dashboard'
        required: true
        default: 'Bug fixes and improvements'
      source_ref:
        description: 'Branch to publish (cut from the installed binary commit)'
        required: true

jobs:
  update:
    name: Push OTA update to production channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: mobile
        run: eas update --channel production --message "${{ github.event.inputs.message }}" --non-interactive
