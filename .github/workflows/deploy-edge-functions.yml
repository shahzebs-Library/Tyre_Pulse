name: Deploy Supabase edge function

# Manual only. Deploys ONE edge function from the repo source, so nobody has
# to install the Supabase CLI or paste function code by hand.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard >
# Account > Access Tokens).
on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        options:
          - ai-tyre-inspection
          - chat-ai
          - ai-orchestrator

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FUNCTION_NAME: ${{ inputs.function }}
      PROJECT_REF: jhssdmeruxtrlqnwfksc
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # All three functions validate the caller themselves, so they are
      # deployed with gateway JWT verification off (as they run today).
      - name: Deploy
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt
