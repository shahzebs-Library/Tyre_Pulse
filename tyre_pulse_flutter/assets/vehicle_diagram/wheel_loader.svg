<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wheel loader body art (CAT-yellow articulated loader). Ported verbatim
  from `mobile/components/VehicleTyreDiagram.tsx`'s `WheelLoaderBody()`.
  Shared by the Wheel loader and Skid loader layouts (viewH 258 -> viewBox
  height 268), matching `kTyreDiagramLayouts`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 268">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="wlBody" cx="48%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="wlCab" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
    <linearGradient id="wlBucket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="40%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="wlArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="248" rx="82" ry="10" fill="#000000" fill-opacity="0.3" />

  <!-- Front frame (bucket side) -->
  <rect x="58" y="22" width="84" height="82" rx="6" fill="url(#wlBody)" />

  <!-- Lift arms -->
  <rect x="60" y="14" width="14" height="90" rx="4" fill="url(#wlArm)" stroke="#78350f" stroke-width="0.8" />
  <rect x="126" y="14" width="14" height="90" rx="4" fill="url(#wlArm)" stroke="#78350f" stroke-width="0.8" />

  <!-- Bucket -->
  <path d="M 44,5 L 156,5 L 160,22 L 40,22 Z" fill="url(#wlBucket)" />
  <rect x="44" y="6" width="112" height="14" rx="2" fill="#374151" />
  <rect x="42" y="3" width="116" height="5" rx="1.5" fill="url(#chrome)" />
  <path d="M 52,3 L 49,0 L 55,0 Z" fill="#94a3b8" />
  <path d="M 69,3 L 66,0 L 72,0 Z" fill="#94a3b8" />
  <path d="M 86,3 L 83,0 L 89,0 Z" fill="#94a3b8" />
  <path d="M 103,3 L 100,0 L 106,0 Z" fill="#94a3b8" />
  <path d="M 120,3 L 117,0 L 123,0 Z" fill="#94a3b8" />
  <path d="M 137,3 L 134,0 L 140,0 Z" fill="#94a3b8" />
  <path d="M 154,3 L 151,0 L 157,0 Z" fill="#94a3b8" />
  <rect x="44" y="5" width="6" height="18" rx="2" fill="#374151" />
  <rect x="150" y="5" width="6" height="18" rx="2" fill="#374151" />

  <!-- Lift arm hydraulic cylinders -->
  <rect x="65" y="20" width="6" height="28" rx="2" fill="#94a3b8" />
  <rect x="129" y="20" width="6" height="28" rx="2" fill="#94a3b8" />
  <rect x="64" y="19" width="8" height="3" rx="1" fill="url(#chrome)" />
  <rect x="128" y="19" width="8" height="3" rx="1" fill="url(#chrome)" />

  <!-- Articulation joint -->
  <rect x="64" y="100" width="72" height="14" rx="5" fill="#374151" stroke="#fde047" stroke-width="1" />
  <circle cx="100" cy="107" r="8" fill="#1f2937" stroke="#fde047" stroke-width="1.5" />
  <circle cx="100" cy="107" r="3.5" fill="#374151" stroke="#94a3b8" stroke-width="0.8" />

  <!-- Rear frame (engine/cab side) -->
  <rect x="56" y="114" width="88" height="118" rx="8" fill="url(#wlBody)" />

  <!-- ROPS cab frame -->
  <rect x="62" y="116" width="76" height="52" rx="5" fill="url(#wlCab)" />
  <rect x="66" y="118" width="68" height="10" rx="2" fill="url(#glassGrad)" opacity="0.9" />
  <rect x="68" y="119" width="30" height="6" rx="1" fill="url(#glassReflect)" opacity="0.5" />
  <rect x="62" y="116" width="5" height="52" rx="2" fill="#92400e" />
  <rect x="133" y="116" width="5" height="52" rx="2" fill="#92400e" />
  <rect x="67" y="128" width="66" height="36" rx="3" fill="#a16207" opacity="0.6" />
  <rect x="82" y="133" width="24" height="18" rx="4" fill="#78350f" />
  <rect x="82" y="133" width="24" height="8" rx="4" fill="#92400e" />
  <circle cx="108" cy="148" r="3" fill="#1f2937" />
  <line x1="108" y1="148" x2="108" y2="153" stroke="#374151" stroke-width="1.5" />
  <circle cx="78" cy="152" r="6" fill="none" stroke="#451a03" stroke-width="2" />
  <circle cx="78" cy="152" r="2" fill="#451a03" />

  <!-- Engine hood -->
  <rect x="62" y="168" width="76" height="56" rx="4" fill="#ca8a04" opacity="0.8" />
  <rect x="70" y="175" width="60" height="6" rx="3" fill="#92400e" opacity="0.5" />
  <rect x="70" y="186" width="60" height="6" rx="3" fill="#92400e" opacity="0.5" />
  <rect x="70" y="197" width="60" height="6" rx="3" fill="#92400e" opacity="0.5" />
  <rect x="70" y="208" width="60" height="6" rx="3" fill="#92400e" opacity="0.5" />
  <circle cx="130" cy="175" r="5" fill="#374151" stroke="#4b5563" stroke-width="1" />
  <circle cx="130" cy="175" r="2.5" fill="#1f2937" />

  <!-- Rear counterweight -->
  <rect x="60" y="224" width="80" height="14" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1" />
  <rect x="65" y="226" width="70" height="10" rx="3" fill="#4b5563" />
  <rect x="62" y="225" width="14" height="10" rx="2" fill="url(#brakeLight)" />
  <rect x="124" y="225" width="14" height="10" rx="2" fill="url(#brakeLight)" />

  <!-- CAT badge -->
  <rect x="84" y="184" width="32" height="12" rx="2" fill="#1f2937" opacity="0.6" />
  <text x="100" y="192" text-anchor="middle" font-size="7" font-weight="900" fill="#fde047" opacity="0.9">CAT</text>
</svg>
