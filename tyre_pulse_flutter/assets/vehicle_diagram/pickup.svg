<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pickup body art. Ported verbatim (paths, gradients, colours) from
  `mobile/components/VehicleTyreDiagram.tsx`'s `PickupBody()`, converted from
  react-native-svg JSX to standard SVG XML. Coordinate space and viewBox
  match `TyreDiagramViewport`/`kTyreDiagramLayouts['Pickup']` exactly
  (viewH 320 -> viewBox height 330), so this asset drops directly into the
  same viewport the wheel painter and hit-targets already use - do not
  change the viewBox without also changing the Dart layout's `viewH`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 330">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="pkRoof" cx="48%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <linearGradient id="pkHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="pkBed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="pkCab" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="305" rx="78" ry="10" fill="#000000" fill-opacity="0.3" />

  <!-- Side body panels - dark trim line -->
  <path d="M 60,70 L 60,275 Q 60,283 72,285 L 128,285 Q 140,283 140,275 L 140,70"
    fill="none" stroke="#1e3a8a" stroke-width="1" />

  <!-- Main body -->
  <path d="M 72,22 Q 60,22 58,36 L 56,70 L 56,275 Q 56,286 72,288 L 128,288 Q 144,286 144,275 L 144,70 L 142,36 Q 140,22 128,22 Z"
    fill="url(#pkRoof)" />

  <!-- Hood -->
  <rect x="60" y="22" width="80" height="52" rx="5" fill="url(#pkHood)" />
  <line x1="100" y1="25" x2="100" y2="73" stroke="#93c5fd" stroke-width="0.8" opacity="0.6" />
  <line x1="72" y1="25" x2="72" y2="73" stroke="#1e3a8a" stroke-width="0.6" opacity="0.5" />
  <line x1="128" y1="25" x2="128" y2="73" stroke="#1e3a8a" stroke-width="0.6" opacity="0.5" />

  <!-- Front bumper -->
  <rect x="60" y="12" width="80" height="13" rx="4" fill="url(#chrome)" />
  <rect x="72" y="15" width="56" height="7" rx="2" fill="#111827" />
  <line x1="79" y1="15" x2="79" y2="22" stroke="#374151" stroke-width="0.8" />
  <line x1="90" y1="15" x2="90" y2="22" stroke="#374151" stroke-width="0.8" />
  <line x1="101" y1="15" x2="101" y2="22" stroke="#374151" stroke-width="0.8" />
  <line x1="112" y1="15" x2="112" y2="22" stroke="#374151" stroke-width="0.8" />
  <line x1="123" y1="15" x2="123" y2="22" stroke="#374151" stroke-width="0.8" />

  <!-- Headlights -->
  <rect x="60" y="13" width="22" height="10" rx="3" fill="url(#headlight)" />
  <rect x="118" y="13" width="22" height="10" rx="3" fill="url(#headlight)" />
  <!-- DRL strip -->
  <rect x="61" y="22" width="80" height="2.5" rx="1" fill="#fbbf24" opacity="0.8" />

  <!-- Windshield -->
  <path d="M 65,74 L 135,74 L 131,96 L 69,96 Z" fill="url(#glassGrad)" />
  <path d="M 70,75 L 115,75 L 112,85 L 72,85 Z" fill="url(#glassReflect)" opacity="0.6" />
  <line x1="80" y1="94" x2="100" y2="78" stroke="#374151" stroke-width="0.8" opacity="0.7" />
  <line x1="120" y1="94" x2="100" y2="78" stroke="#374151" stroke-width="0.8" opacity="0.7" />

  <!-- Cab roof -->
  <rect x="60" y="96" width="80" height="64" rx="3" fill="url(#pkCab)" />
  <path d="M 60,96 L 65,74" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
  <path d="M 140,96 L 135,74" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
  <rect x="73" y="100" width="54" height="4" rx="2" fill="#60a5fa" opacity="0.4" />
  <line x1="100" y1="98" x2="100" y2="158" stroke="#1e3a8a" stroke-width="1.2" opacity="0.8" />
  <rect x="84" y="128" width="10" height="3" rx="1.5" fill="url(#chrome)" />
  <rect x="106" y="128" width="10" height="3" rx="1.5" fill="url(#chrome)" />
  <ellipse cx="80" cy="110" rx="10" ry="7" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="0.5" />
  <ellipse cx="120" cy="110" rx="10" ry="7" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="0.5" />
  <circle cx="83" cy="135" r="8" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="83" cy="135" r="2.5" fill="#0f172a" />
  <line x1="83" y1="128" x2="83" y2="142" stroke="#0f172a" stroke-width="1.2" />
  <line x1="76" y1="135" x2="90" y2="135" stroke="#0f172a" stroke-width="1.2" />

  <!-- Rear window -->
  <path d="M 68,158 L 132,158 L 130,169 L 70,169 Z" fill="url(#glassGrad)" opacity="0.85" />
  <path d="M 72,159 L 105,159 L 103,165 L 74,165 Z" fill="url(#glassReflect)" opacity="0.5" />
  <path d="M 60,160 L 60,165" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
  <path d="M 140,160 L 140,165" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />

  <!-- Pickup bed -->
  <rect x="60" y="172" width="80" height="108" rx="3" fill="url(#pkBed)" />
  <line x1="63" y1="180" x2="137" y2="180" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <line x1="63" y1="196" x2="137" y2="196" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <line x1="63" y1="212" x2="137" y2="212" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <line x1="63" y1="228" x2="137" y2="228" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <line x1="63" y1="244" x2="137" y2="244" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <line x1="63" y1="260" x2="137" y2="260" stroke="#1e3a8a" stroke-width="0.7" opacity="0.5" />
  <rect x="60" y="172" width="5" height="108" fill="#1d4ed8" opacity="0.9" />
  <rect x="135" y="172" width="5" height="108" fill="#1d4ed8" opacity="0.9" />
  <rect x="65" y="173" width="70" height="18" rx="2" fill="#1e40af" />
  <line x1="100" y1="173" x2="100" y2="191" stroke="#3b82f6" stroke-width="0.8" opacity="0.6" />

  <!-- Rear bumper -->
  <rect x="60" y="281" width="80" height="12" rx="4" fill="url(#chrome)" />
  <rect x="62" y="282" width="20" height="8" rx="2" fill="url(#brakeLight)" />
  <rect x="118" y="282" width="20" height="8" rx="2" fill="url(#brakeLight)" />
  <rect x="86" y="283" width="28" height="6" rx="2" fill="#111827" />

  <!-- Side mirrors -->
  <rect x="42" y="65" width="15" height="7" rx="2.5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5" />
  <rect x="143" y="65" width="15" height="7" rx="2.5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5" />
  <line x1="57" y1="68.5" x2="60" y2="70" stroke="#1e3a8a" stroke-width="1.5" />
  <line x1="143" y1="68.5" x2="140" y2="70" stroke="#1e3a8a" stroke-width="1.5" />
</svg>
