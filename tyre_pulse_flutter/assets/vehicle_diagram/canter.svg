<?xml version="1.0" encoding="UTF-8"?>
<!--
  Canter body art (white commercial truck, orange stripe). Ported verbatim
  from `mobile/components/VehicleTyreDiagram.tsx`'s `CanterBody()`. Shared by
  the Canter, Truck 6x4 and Tanker layouts (viewH 310 -> viewBox height 320)
  and, per `tyre_diagram_layouts.dart`'s own documented trade-off, reused for
  the Trailer layout (viewH 270) for lack of a dedicated trailer body - the
  wheel arrangement there is accurate even though this body was authored for
  a taller canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 320">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="ctBody" cx="48%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <linearGradient id="ctHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="ctCargo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="15%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="ctStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="300" rx="80" ry="10" fill="#000000" fill-opacity="0.25" />

  <!-- Main body -->
  <path d="M 70,18 Q 57,18 56,30 L 54,110 L 54,278 Q 54,288 70,290 L 130,290 Q 146,288 146,278 L 146,110 L 144,30 Q 143,18 130,18 Z"
    fill="url(#ctBody)" />

  <!-- Cab section -->
  <rect x="58" y="18" width="84" height="100" rx="5" fill="url(#ctBody)" />

  <!-- Front bumper - heavy chrome -->
  <rect x="58" y="8" width="84" height="14" rx="4" fill="url(#chrome)" />
  <rect x="68" y="10" width="64" height="5" rx="2" fill="#94a3b8" />
  <rect x="62" y="10" width="8" height="10" rx="2" fill="url(#headlight)" />
  <rect x="130" y="10" width="8" height="10" rx="2" fill="url(#headlight)" />

  <!-- Headlights - rectangular -->
  <rect x="58" y="11" width="26" height="11" rx="3" fill="url(#headlight)" />
  <rect x="116" y="11" width="26" height="11" rx="3" fill="url(#headlight)" />
  <rect x="60" y="21" width="80" height="2.5" rx="1" fill="#fb923c" opacity="0.9" />

  <!-- Hood -->
  <rect x="60" y="23" width="80" height="42" rx="4" fill="url(#ctHood)" />
  <line x1="100" y1="25" x2="100" y2="64" stroke="#f8fafc" stroke-width="1" opacity="0.6" />
  <rect x="68" y="32" width="64" height="3" rx="1.5" fill="#94a3b8" opacity="0.5" />
  <rect x="68" y="39" width="64" height="3" rx="1.5" fill="#94a3b8" opacity="0.5" />
  <rect x="68" y="46" width="64" height="3" rx="1.5" fill="#94a3b8" opacity="0.5" />
  <rect x="68" y="53" width="64" height="3" rx="1.5" fill="#94a3b8" opacity="0.5" />

  <!-- Windshield -->
  <path d="M 62,65 L 138,65 L 134,84 L 66,84 Z" fill="url(#glassGrad)" />
  <path d="M 68,66 L 114,66 L 111,76 L 71,76 Z" fill="url(#glassReflect)" opacity="0.5" />
  <line x1="76" y1="82" x2="98" y2="68" stroke="#475569" stroke-width="0.8" opacity="0.7" />
  <line x1="124" y1="82" x2="102" y2="68" stroke="#475569" stroke-width="0.8" opacity="0.7" />

  <!-- Cab interior -->
  <rect x="58" y="84" width="84" height="40" rx="3" fill="#cbd5e1" />
  <rect x="64" y="88" width="20" height="15" rx="3" fill="#94a3b8" />
  <rect x="64" y="88" width="20" height="6" rx="3" fill="#e2e8f0" />
  <rect x="116" y="88" width="20" height="15" rx="3" fill="#94a3b8" />
  <rect x="116" y="88" width="20" height="6" rx="3" fill="#e2e8f0" />
  <rect x="64" y="106" width="72" height="6" rx="2" fill="#475569" />
  <circle cx="80" cy="112" r="8" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <circle cx="80" cy="112" r="2.5" fill="#1e293b" />

  <!-- Orange stripe -->
  <rect x="58" y="118" width="84" height="10" fill="url(#ctStripe)" />

  <!-- Cargo box -->
  <rect x="58" y="128" width="84" height="154" rx="3" fill="url(#ctCargo)" />
  <line x1="60" y1="145" x2="140" y2="145" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
  <line x1="60" y1="173" x2="140" y2="173" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
  <line x1="60" y1="201" x2="140" y2="201" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
  <line x1="60" y1="229" x2="140" y2="229" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
  <line x1="60" y1="257" x2="140" y2="257" stroke="#94a3b8" stroke-width="1" opacity="0.6" />
  <rect x="58" y="128" width="5" height="154" fill="#cbd5e1" />
  <rect x="137" y="128" width="5" height="154" fill="#cbd5e1" />

  <!-- Rear bumper -->
  <rect x="60" y="283" width="80" height="11" rx="3" fill="url(#chrome)" />
  <rect x="62" y="284" width="20" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="118" y="284" width="20" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="84" y="285" width="32" height="5" rx="2" fill="#fb923c" opacity="0.7" />
  <rect x="82" y="274" width="36" height="8" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5" />

  <!-- Exhaust pipe -->
  <circle cx="55" cy="265" r="3" fill="#374151" stroke="#1f2937" stroke-width="0.8" />
  <circle cx="55" cy="265" r="1.5" fill="#111827" />

  <!-- Mirrors -->
  <rect x="39" y="55" width="17" height="9" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" />
  <rect x="144" y="55" width="17" height="9" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" />
</svg>
