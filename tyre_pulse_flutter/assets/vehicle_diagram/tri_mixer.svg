<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tri-mixer body art (Green Concrete Company livery, white + green). Ported
  verbatim from `mobile/components/VehicleTyreDiagram.tsx`'s `TriMixerBody()`
  - the drum, its spiral fins and the GCC branding are the real production
  artwork, not a placeholder. viewH 360 -> viewBox height 370, matching
  `kTyreDiagramLayouts['Tri-mixer']`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 370">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="tmBody" cx="48%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <linearGradient id="tmHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="tmGreenStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004d26" />
      <stop offset="30%" stop-color="#006C35" />
      <stop offset="50%" stop-color="#00A850" />
      <stop offset="70%" stop-color="#006C35" />
      <stop offset="100%" stop-color="#004d26" />
    </linearGradient>
    <radialGradient id="tmDrum" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
    <radialGradient id="tmDrumHub" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <radialGradient id="tmLogoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#006C35" />
      <stop offset="100%" stop-color="#004d26" />
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="352" rx="80" ry="10" fill="#000000" fill-opacity="0.25" />

  <!-- Cab - white -->
  <path d="M 70,14 Q 57,14 56,28 L 54,108 L 54,125 L 146,125 L 146,108 L 144,28 Q 143,14 130,14 Z"
    fill="url(#tmBody)" />

  <!-- Front bumper chrome -->
  <rect x="58" y="6" width="84" height="12" rx="4" fill="url(#chrome)" />
  <rect x="66" y="8" width="68" height="5" rx="2" fill="#1e293b" />
  <rect x="68" y="9" width="64" height="1" rx="0.5" fill="#475569" opacity="0.7" />
  <rect x="68" y="10.5" width="64" height="1" rx="0.5" fill="#475569" opacity="0.7" />
  <rect x="68" y="12" width="64" height="1" rx="0.5" fill="#475569" opacity="0.7" />

  <!-- Headlights -->
  <rect x="58" y="7" width="24" height="12" rx="3" fill="url(#headlight)" />
  <rect x="118" y="7" width="24" height="12" rx="3" fill="url(#headlight)" />
  <rect x="60" y="18" width="80" height="3" rx="1" fill="#00A850" opacity="0.95" />

  <!-- Hood - white -->
  <rect x="60" y="21" width="80" height="42" rx="4" fill="url(#tmHood)" />
  <line x1="100" y1="23" x2="100" y2="62" stroke="#cbd5e1" stroke-width="1" opacity="0.7" />
  <rect x="70" y="30" width="60" height="4" rx="2" fill="#cbd5e1" opacity="0.5" />
  <rect x="70" y="39" width="60" height="4" rx="2" fill="#cbd5e1" opacity="0.5" />
  <rect x="70" y="48" width="60" height="4" rx="2" fill="#cbd5e1" opacity="0.5" />

  <!-- Green Concrete logo on hood -->
  <circle cx="100" cy="44" r="10" fill="url(#tmLogoBg)" opacity="0.9" />
  <path d="M 96,44 Q 96,39 100,38 Q 106,38 106,44 Q 106,49 100,50 Q 97,50 96,48 L 96,44 Z"
    fill="#00A850" />
  <line x1="100" y1="50" x2="100" y2="54" stroke="#00A850" stroke-width="1.2" />
  <text x="100" y="57" text-anchor="middle" font-size="3.5" font-weight="800" fill="#006C35">GCC</text>

  <!-- Windshield -->
  <path d="M 63,63 L 137,63 L 133,80 L 67,80 Z" fill="url(#glassGrad)" />
  <path d="M 68,64 L 112,64 L 109,74 L 71,74 Z" fill="url(#glassReflect)" opacity="0.5" />
  <line x1="78" y1="78" x2="98" y2="65" stroke="#475569" stroke-width="0.8" opacity="0.6" />
  <line x1="122" y1="78" x2="102" y2="65" stroke="#475569" stroke-width="0.8" opacity="0.6" />

  <!-- Cab interior -->
  <rect x="58" y="80" width="84" height="42" rx="3" fill="#e2e8f0" />
  <rect x="65" y="84" width="18" height="14" rx="3" fill="#cbd5e1" />
  <rect x="117" y="84" width="18" height="14" rx="3" fill="#cbd5e1" />
  <circle cx="80" cy="108" r="8" fill="none" stroke="#334155" stroke-width="2.5" />
  <circle cx="80" cy="108" r="2.5" fill="#334155" />

  <!-- Green brand stripe across cab bottom -->
  <rect x="58" y="116" width="84" height="10" fill="url(#tmGreenStripe)" />
  <text x="100" y="123" text-anchor="middle" font-size="4" font-weight="800"
    fill="#ffffff" letter-spacing="0.5px">GREEN CONCRETE</text>

  <!-- Chassis frame -->
  <rect x="68" y="126" width="12" height="215" fill="#334155" />
  <rect x="120" y="126" width="12" height="215" fill="#334155" />
  <rect x="68" y="148" width="64" height="6" fill="#475569" />
  <rect x="68" y="198" width="64" height="6" fill="#475569" />
  <rect x="68" y="248" width="64" height="6" fill="#475569" />
  <rect x="68" y="298" width="64" height="6" fill="#475569" />

  <!-- Drum - white with green fins -->
  <ellipse cx="100" cy="228" rx="44" ry="100" fill="url(#tmDrum)" />
  <ellipse cx="100" cy="228" rx="44" ry="100" fill="none" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Green spiral fins - thick primary spiral -->
  <path d="M 58,135 Q 100,126 142,135" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,156 Q 100,165 142,156" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,177 Q 100,168 142,177" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,198 Q 100,207 142,198" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,219 Q 100,210 142,219" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,240 Q 100,249 142,240" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,261 Q 100,252 142,261" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,282 Q 100,291 142,282" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <path d="M 58,303 Q 100,294 142,303" fill="none" stroke="#006C35" stroke-width="2.2" opacity="0.9" />
  <!-- Thin secondary spiral -->
  <path d="M 60,134 Q 100,125 140,134" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,155 Q 100,164 140,155" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,176 Q 100,167 140,176" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,197 Q 100,206 140,197" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,218 Q 100,209 140,218" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,239 Q 100,248 140,239" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,260 Q 100,251 140,260" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,281 Q 100,290 140,281" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />
  <path d="M 60,302 Q 100,293 140,302" fill="none" stroke="#00A850" stroke-width="0.8" opacity="0.5" />

  <!-- Green Concrete logo badge on drum -->
  <ellipse cx="100" cy="228" rx="22" ry="22" fill="url(#tmLogoBg)" stroke="#00A850" stroke-width="1.5" />
  <path d="M 96,224 Q 95,218 100,217 Q 107,217 107,224 Q 107,231 100,232 Q 96,232 95,229 L 96,224 Z"
    fill="#00A850" />
  <line x1="100" y1="232" x2="100" y2="237" stroke="#00A850" stroke-width="1.5" />
  <text x="100" y="241" text-anchor="middle" font-size="4.5" font-weight="900" fill="#ffffff">GCC</text>
  <text x="100" y="246" text-anchor="middle" font-size="3" fill="#86efac" letter-spacing="0.3px">THINK &#183; BELIEVE &#183; GREEN</text>

  <!-- Hub bolts ring -->
  <ellipse cx="100" cy="228" rx="14" ry="14" fill="url(#tmDrumHub)" stroke="#94a3b8" stroke-width="1" />
  <circle cx="109" cy="228" r="1.8" fill="#475569" />
  <circle cx="102.781" cy="236.559" r="1.8" fill="#475569" />
  <circle cx="92.719" cy="233.29" r="1.8" fill="#475569" />
  <circle cx="92.719" cy="222.71" r="1.8" fill="#475569" />
  <circle cx="102.781" cy="219.441" r="1.8" fill="#475569" />
  <circle cx="100" cy="228" r="4.5" fill="#1e293b" />

  <!-- Water tank -->
  <rect x="70" y="315" width="60" height="24" rx="4" fill="#006C35" opacity="0.8" />
  <rect x="72" y="317" width="56" height="8" rx="2" fill="#00A850" opacity="0.3" />
  <text x="100" y="330" text-anchor="middle" font-size="4" fill="#ffffff" opacity="0.8" font-weight="600">WATER</text>

  <!-- Rear chassis + lights -->
  <rect x="58" y="335" width="84" height="12" rx="3" fill="url(#chrome)" />
  <rect x="60" y="336" width="22" height="8" rx="2" fill="url(#brakeLight)" />
  <rect x="118" y="336" width="22" height="8" rx="2" fill="url(#brakeLight)" />
  <rect x="82" y="337" width="36" height="6" rx="2" fill="#006C35" opacity="0.8" />

  <!-- Mirrors - green -->
  <rect x="39" y="52" width="17" height="9" rx="3" fill="#006C35" stroke="#004d26" stroke-width="0.5" />
  <rect x="144" y="52" width="17" height="9" rx="3" fill="#006C35" stroke="#004d26" stroke-width="0.5" />
</svg>
