<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tata body art (blue Tata Prima heavy truck). Ported verbatim from
  `mobile/components/VehicleTyreDiagram.tsx`'s `TataBody()`. viewH 305 ->
  viewBox height 315, matching `kTyreDiagramLayouts['Tata']`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 315">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="tataCab" cx="48%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4d8fd1" />
      <stop offset="40%" stop-color="#0072CE" />
      <stop offset="80%" stop-color="#003087" />
      <stop offset="100%" stop-color="#001f5b" />
    </radialGradient>
    <linearGradient id="tataHood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001f5b" />
      <stop offset="30%" stop-color="#0072CE" />
      <stop offset="50%" stop-color="#4d8fd1" />
      <stop offset="70%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#001f5b" />
    </linearGradient>
    <linearGradient id="tataCargo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="15%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="tataStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001f5b" />
      <stop offset="30%" stop-color="#003087" />
      <stop offset="50%" stop-color="#0072CE" />
      <stop offset="70%" stop-color="#003087" />
      <stop offset="100%" stop-color="#001f5b" />
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="298" rx="80" ry="10" fill="#000000" fill-opacity="0.28" />

  <!-- Cab - Tata Prima style, blue -->
  <path d="M 68,14 Q 56,14 55,27 L 53,112 L 53,128 L 147,128 L 147,112 L 145,27 Q 144,14 132,14 Z"
    fill="url(#tataCab)" />

  <!-- Front bumper - heavy chrome + bull bar -->
  <rect x="56" y="5" width="88" height="13" rx="4" fill="url(#chrome)" />
  <rect x="60" y="8" width="80" height="4" rx="2" fill="#94a3b8" />
  <rect x="75" y="5" width="4" height="13" rx="1" fill="#94a3b8" />
  <rect x="121" y="5" width="4" height="13" rx="1" fill="#94a3b8" />
  <rect x="58" y="7" width="14" height="9" rx="2" fill="url(#headlight)" opacity="0.8" />
  <rect x="128" y="7" width="14" height="9" rx="2" fill="url(#headlight)" opacity="0.8" />

  <!-- Main headlights -->
  <rect x="55" y="8" width="26" height="13" rx="3" fill="url(#headlight)" />
  <rect x="119" y="8" width="26" height="13" rx="3" fill="url(#headlight)" />
  <rect x="57" y="18" width="86" height="3" rx="1" fill="#0072CE" opacity="0.95" />

  <!-- Hood -->
  <rect x="58" y="21" width="84" height="46" rx="4" fill="url(#tataHood)" />
  <line x1="100" y1="23" x2="100" y2="66" stroke="#4d8fd1" stroke-width="1.2" opacity="0.6" />
  <rect x="68" y="28" width="64" height="4" rx="2" fill="#001f5b" opacity="0.5" />
  <rect x="68" y="36" width="64" height="4" rx="2" fill="#001f5b" opacity="0.5" />
  <rect x="68" y="44" width="64" height="4" rx="2" fill="#001f5b" opacity="0.5" />
  <rect x="68" y="52" width="64" height="4" rx="2" fill="#001f5b" opacity="0.5" />

  <!-- TATA logo on hood -->
  <rect x="84" y="40" width="32" height="14" rx="3" fill="#001f5b" opacity="0.85" />
  <text x="100" y="50" text-anchor="middle" font-size="8" font-weight="900"
    fill="#ffffff" letter-spacing="1px">TATA</text>

  <!-- Windshield -->
  <path d="M 61,67 L 139,67 L 135,85 L 65,85 Z" fill="url(#glassGrad)" />
  <path d="M 66,68 L 112,68 L 109,78 L 69,78 Z" fill="url(#glassReflect)" opacity="0.5" />
  <line x1="76" y1="83" x2="97" y2="69" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
  <line x1="124" y1="83" x2="103" y2="69" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />

  <!-- Cab interior -->
  <rect x="57" y="85" width="86" height="40" rx="3" fill="#003087" opacity="0.7" />
  <rect x="64" y="89" width="18" height="14" rx="3" fill="#001f5b" />
  <rect x="118" y="89" width="18" height="14" rx="3" fill="#001f5b" />
  <circle cx="80" cy="114" r="8" fill="none" stroke="#001f5b" stroke-width="2.5" />
  <circle cx="80" cy="114" r="2.5" fill="#001f5b" />

  <!-- Blue stripe on cab bottom -->
  <rect x="57" y="120" width="86" height="9" fill="url(#tataStripe)" />
  <text x="100" y="126.5" text-anchor="middle" font-size="4" font-weight="800"
    fill="#ffffff" letter-spacing="0.4px">TATA PRIMA &#183; HEAVY DUTY</text>

  <!-- Chassis -->
  <rect x="67" y="129" width="11" height="158" fill="#334155" />
  <rect x="122" y="129" width="11" height="158" fill="#334155" />
  <rect x="67" y="145" width="66" height="6" fill="#475569" />
  <rect x="67" y="190" width="66" height="6" fill="#475569" />
  <rect x="67" y="235" width="66" height="6" fill="#475569" />

  <!-- Cargo box - white with blue stripe -->
  <rect x="57" y="129" width="86" height="152" rx="3" fill="url(#tataCargo)" />
  <rect x="57" y="129" width="5" height="152" fill="#003087" opacity="0.8" rx="1" />
  <rect x="138" y="129" width="5" height="152" fill="#003087" opacity="0.8" rx="1" />
  <line x1="59" y1="148" x2="141" y2="148" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="175" x2="141" y2="175" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="202" x2="141" y2="202" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="229" x2="141" y2="229" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />
  <line x1="59" y1="256" x2="141" y2="256" stroke="#94a3b8" stroke-width="0.8" opacity="0.5" />

  <!-- Rear bumper -->
  <rect x="58" y="281" width="84" height="11" rx="3" fill="url(#chrome)" />
  <rect x="60" y="282" width="22" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="118" y="282" width="22" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="84" y="283" width="32" height="5" rx="2" fill="#003087" opacity="0.7" />

  <!-- Exhaust -->
  <circle cx="55" cy="268" r="3.5" fill="#374151" stroke="#1f2937" stroke-width="0.8" />
  <circle cx="55" cy="268" r="1.8" fill="#111827" />

  <!-- Mirrors - Tata Prima style -->
  <rect x="37" y="54" width="17" height="10" rx="3" fill="#0072CE" stroke="#003087" stroke-width="0.8" />
  <rect x="146" y="54" width="17" height="10" rx="3" fill="#0072CE" stroke="#003087" stroke-width="0.8" />
</svg>
