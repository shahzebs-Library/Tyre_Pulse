name: Deploy Supabase edge function

# Manual only. Deploys ONE edge function from the repo source, so nobody has
# to install the Supabase CLI or paste function code by hand.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard >
# Account > Access Tokens).
on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        options:
          - account-recovery
          - admin-revoke-sessions
          - ai-orchestrator
          - ai-tyre-inspection
          - billing-checkout
          - billing-webhook
          - chat-ai
          - embed-worker
          - generate-embedding
          - public-api
          - qr-login
          - send-email
          - send-scheduled-reports
          - sentry-crash-alert
          - sentry-issues
          - sign-in
          - tenant-export
          - workflow-notify

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FUNCTION_NAME: ${{ inputs.function }}
      PROJECT_REF: jhssdmeruxtrlqnwfksc
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Every function validates the caller itself and runs today with gateway
      # JWT verification off, except generate-embedding, which keeps it on.
      - name: Deploy
        run: |
          if [ "$FUNCTION_NAME" = "generate-embedding" ]; then
            supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
          else
            supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt
          fi
