name: Codex Dart Format Capture

on:
  push:
    branches:
      - codex/flutter-checklist-production-fix

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - name: Format and print changed files
        working-directory: tyre_pulse_flutter
        shell: bash
        run: |
          dart format lib/features/checklists/presentation/checklists_home_screen.dart test/features/checklists/presentation/checklists_home_screen_test.dart
          echo SCREEN_B64_BEGIN
          base64 -w0 lib/features/checklists/presentation/checklists_home_screen.dart
          echo
          echo SCREEN_B64_END
          echo TEST_B64_BEGIN
          base64 -w0 test/features/checklists/presentation/checklists_home_screen_test.dart
          echo
          echo TEST_B64_END
