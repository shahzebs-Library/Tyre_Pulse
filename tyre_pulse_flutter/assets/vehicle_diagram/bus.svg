<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bus body art (white staff/transit bus, green GCC stripe). Ported verbatim
  from `mobile/components/VehicleTyreDiagram.tsx`'s `BusBody()`. viewH 330
  -> viewBox height 340, matching `kTyreDiagramLayouts['Bus']`. The ground
  shadow (cy=340, ry=10) sits a few units below that boundary, exactly as
  authored in the source, which relies on the RN SVG's `overflow: visible`
  styling; a renderer that clips to the viewBox may crop the very bottom
  edge of that decorative shadow only - no wheel or structural artwork is
  affected.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 220 340">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6" />
    </radialGradient>
    <radialGradient id="brakeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="60%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7" />
    </radialGradient>
    <radialGradient id="busRoof" cx="48%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <linearGradient id="busStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004d26" />
      <stop offset="30%" stop-color="#006C35" />
      <stop offset="50%" stop-color="#00A850" />
      <stop offset="70%" stop-color="#006C35" />
      <stop offset="100%" stop-color="#004d26" />
    </linearGradient>
    <linearGradient id="busWindow" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <ellipse cx="100" cy="340" rx="86" ry="10" fill="#000000" fill-opacity="0.25" />

  <!-- Main body - wide rectangular coach -->
  <path d="M 52,20 Q 40,20 38,34 L 36,290 Q 36,305 52,308 L 148,308 Q 164,305 164,290 L 164,34 Q 162,20 148,20 Z"
    fill="url(#busRoof)" />

  <!-- Front bumper -->
  <rect x="38" y="10" width="124" height="14" rx="5" fill="url(#chrome)" />
  <!-- Destination board -->
  <rect x="54" y="12" width="92" height="7" rx="2" fill="#0f172a" />
  <text x="100" y="17.5" text-anchor="middle" font-size="4" fill="#fde047" font-weight="700">STAFF BUS &#183; GCC</text>
  <!-- Headlights -->
  <rect x="38" y="12" width="18" height="11" rx="3" fill="url(#headlight)" />
  <rect x="144" y="12" width="18" height="11" rx="3" fill="url(#headlight)" />
  <rect x="40" y="23" width="120" height="3" rx="1" fill="#00A850" opacity="0.9" />
  <!-- Front windshield - wide panoramic -->
  <path d="M 42,26 L 158,26 L 155,48 L 45,48 Z" fill="url(#glassGrad)" />
  <path d="M 46,27 L 120,27 L 118,40 L 48,40 Z" fill="url(#glassReflect)" opacity="0.5" />
  <line x1="60" y1="46" x2="96" y2="30" stroke="#475569" stroke-width="0.8" opacity="0.6" />
  <line x1="140" y1="46" x2="104" y2="30" stroke="#475569" stroke-width="0.8" opacity="0.6" />

  <!-- Green stripe - runs full length -->
  <rect x="36" y="130" width="128" height="14" fill="url(#busStripe)" />
  <text x="100" y="139.5" text-anchor="middle" font-size="4.5" font-weight="800"
    fill="#ffffff" letter-spacing="0.8px">GREEN CONCRETE COMPANY</text>

  <!-- Side windows - left + right columns -->
  <rect x="36" y="55" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="36" y="93" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="36" y="131" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="36" y="169" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="36" y="207" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="36" y="245" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="55" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="93" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="131" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="169" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="207" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />
  <rect x="156" y="245" width="8" height="26" rx="2" fill="url(#busWindow)" opacity="0.85" />

  <!-- Interior - seats visible from top -->
  <rect x="44" y="50" width="112" height="248" rx="3" fill="#f8fafc" opacity="0.15" />
  <g>
    <rect x="46" y="56" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="56" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="83" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="83" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="110" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="110" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="137" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="137" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="164" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="164" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="191" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="191" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="218" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="218" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="245" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="245" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <g>
    <rect x="46" y="272" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
    <rect x="132" y="272" width="22" height="16" rx="3" fill="#e2e8f0" opacity="0.5" />
  </g>
  <line x1="100" y1="50" x2="100" y2="295" stroke="#cbd5e1" stroke-width="0.5"
    stroke-dasharray="4 4" opacity="0.4" />

  <!-- Front door -->
  <rect x="36" y="54" width="10" height="30" rx="2" fill="#006C35" opacity="0.7" />
  <rect x="38" y="56" width="6" height="26" rx="1" fill="#00A850" opacity="0.4" />

  <!-- Rear -->
  <path d="M 44,292 L 156,292 L 154,306 L 46,306 Z" fill="url(#glassGrad)" opacity="0.8" />
  <path d="M 48,293 L 110,293 L 108,302 L 50,302 Z" fill="url(#glassReflect)" opacity="0.4" />
  <rect x="38" y="306" width="124" height="10" rx="4" fill="url(#chrome)" />
  <rect x="40" y="307" width="28" height="7" rx="2" fill="url(#brakeLight)" />
  <rect x="132" y="307" width="28" height="7" rx="2" fill="url(#brakeLight)" />
  <circle cx="42" cy="303" r="4" fill="#374151" stroke="#1f2937" stroke-width="1" />
  <circle cx="42" cy="303" r="2" fill="#111827" />

  <!-- Mirrors - large coach mirrors -->
  <rect x="16" y="30" width="20" height="10" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8" />
  <rect x="164" y="30" width="20" height="10" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8" />
</svg>
