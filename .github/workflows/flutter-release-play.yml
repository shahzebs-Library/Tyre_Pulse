name: Flutter Release - Play Closed Testing

# Builds the signed AAB for com.shahzebrahman.tyrepulse (a SEPARATE Play
# listing from the retired Expo app com.shahzebrahman.tyrepulseinspector) and,
# ONLY when the "upload_to_play" input is ticked, publishes it to Play Closed
# testing (track 'alpha'). Unticked (the default) the run builds and
# validates the AAB and keeps it as a GitHub artifact - nothing reaches Play.
#
# workflow_dispatch ONLY - must never fire on push or PR.
#
# Build preparation is the shared .github/actions/flutter-android-build
# action (also used by flutter-internal-apk.yml): Flutter pinned to 3.47.2,
# the COMMITTED MainActivity.kt kept (biometric + push channels), release
# signing, APP_ENV=production.
#
# Required repository secrets:
#   GOOGLE_SERVICE_ACCOUNT_KEY_F  - Play Console service-account JSON (upload only)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
#   ANDROID_KEY_ALIAS             - the upload keystore
# Optional: FLUTTER_SENTRY_DSN (crash reporting), SUPABASE_ANON_KEY_PROD.

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload the AAB to Play Closed testing (alpha). Leave unticked to build and validate only."
        type: boolean
        default: false

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build signed AAB (publish to Closed testing only when asked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: ./.github/actions/flutter-android-build
        with:
          artifact: appbundle
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          supabase-url: ${{ vars.SUPABASE_URL || 'https://jhssdmeruxtrlqnwfksc.supabase.co' }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY_PROD || 'sb_publishable_UDEH7EeHA9S5-NNu4T-9Ug_R60IinrW' }}
          sentry-dsn: ${{ secrets.FLUTTER_SENTRY_DSN || secrets.SENTRY_DSN_FLUTTER || '' }}

      - name: Verify the AAB is signed with the upload key
        working-directory: tyre_pulse_flutter
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > /tmp/verify.txt 2>&1 || { cat /tmp/verify.txt; exit 1; }
          grep -q "jar verified" /tmp/verify.txt || { cat /tmp/verify.txt; echo "::error::AAB is not signed"; exit 1; }
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" || echo "::warning::could not print the AAB certificate"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyre-pulse-release-aab
          path: tyre_pulse_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # OWNER RULE 2026-09-29: Flutter publishes to Closed testing (Play track
      # 'alpha') only. Production stays the owner's call. The guard fails the
      # run if the track or the package is ever changed.
      - name: Guard - Closed testing only, never production
        if: ${{ inputs.upload_to_play }}
        env:
          PLAY_TRACK: alpha
          PLAY_PACKAGE: com.shahzebrahman.tyrepulse
        run: |
          if [ "$PLAY_TRACK" != "alpha" ]; then echo "::error::Flutter releases go to Closed testing (alpha) only (owner rule)."; exit 1; fi
          if [ "$PLAY_PACKAGE" = "com.shahzebrahman.tyrepulseinspector" ]; then echo "::error::Never publish Flutter into the production app listing."; exit 1; fi
          if ! grep -q '^          track: alpha$' .github/workflows/flutter-release-play.yml; then echo "::error::Publish step track is not alpha (Closed testing)."; exit 1; fi
          if ! grep -q '^          packageName: com.shahzebrahman.tyrepulse$' .github/workflows/flutter-release-play.yml; then echo "::error::Publish step package is not com.shahzebrahman.tyrepulse."; exit 1; fi

      - name: Publish to Play Console Closed Testing
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_F }}
          packageName: com.shahzebrahman.tyrepulse
          releaseFiles: tyre_pulse_flutter/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed

      - name: Report upload decision
        run: |
          if [ "${{ inputs.upload_to_play }}" = "true" ]; then
            echo "Uploaded to Play Closed testing (alpha)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build and validation only - NOT uploaded to Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The signing key and its passwords must not outlive the job.
      - name: Remove signing files
        if: always()
        working-directory: tyre_pulse_flutter
        run: rm -f android/app/release.jks android/key.properties
