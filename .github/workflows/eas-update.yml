name: OTA Update (EAS Update)

# Pushes a JS-only over-the-air update to all devices already running the
# current app version — no Play Store, no install required on the user's phone.
#
# Trigger: manually (Actions -> Run workflow).
# Required secret: EXPO_TOKEN (expo.dev -> Account -> Access tokens)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Short release note shown in the EAS dashboard'
        required: true
        default: 'Bug fixes and improvements'

jobs:
  update:
    name: Push OTA update to production channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: mobile
        run: eas update --channel production --message "${{ github.event.inputs.message }}" --non-interactive
