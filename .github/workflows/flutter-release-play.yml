name: Flutter Release - Play Internal Testing

# PUBLISHES to Google Play Console Internal Testing for the app
# com.shahzebrahman.tyrepulse - a SEPARATE, distinct app listing from the
# existing production React Native app (com.shahzebrahman.tyrepulseinspector),
# with its own throwaway signing key generated specifically for this purpose.
# There is zero signing-continuity risk with the RN app: different package
# name, different key, different Play Console listing.
#
# workflow_dispatch ONLY, deliberately - this must never fire on a push or a
# PR. Every trigger is a real, visible upload to internal testers; nobody
# should get a new build just because someone pushed to main.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICE_ACCOUNT_KEY_F  - the Play Console service-account JSON,
#     already created and already granted access on this app (per the user).
#   ANDROID_KEYSTORE_BASE64       - base64 of the release .jks keystore file.
#   ANDROID_KEYSTORE_PASSWORD     - the keystore's store password.
#   ANDROID_KEY_PASSWORD          - the key's password (same as the store
#     password for a PKCS12 keystore, which is the modern keytool default).
#   ANDROID_KEY_ALIAS             - the key alias inside the keystore.

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: tyre_pulse_flutter

jobs:
  build_and_publish:
    name: Build signed AAB and publish to Internal Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folder
        # android/ is deliberately not committed (see flutter-ci.yml's
        # identical step and docs/BOOTSTRAP.md) - generated fresh here just
        # to get every OTHER file flutter create produces (Gradle wrapper,
        # manifest, Kotlin scaffold, ios/ for parity). build.gradle.kts is
        # fully overwritten with known-good content in a later step below,
        # so nothing here needs to patch that one. MainActivity.kt is a
        # SEPARATE file with its own package declaration that build.gradle.kts
        # cannot fix by itself - see the next step.
        run: flutter create --platforms=android,ios --org com.shahzebrahman --project-name tyre_pulse .

      - name: Fix MainActivity.kt's package to match the Gradle namespace
        # flutter create writes MainActivity.kt under
        # android/app/src/main/kotlin/com/shahzebrahman/tyre_pulse/ and
        # declares `package com.shahzebrahman.tyre_pulse` inside the file
        # itself. The next step overwrites build.gradle.kts's namespace and
        # applicationId to com.shahzebrahman.tyrepulse, but that alone does
        # not relocate or repatch this file. Left as-is,
        # AndroidManifest.xml's android:name=".MainActivity" resolves
        # against the new Gradle namespace while the compiled class only
        # exists under the OLD package - Android throws
        # ClassNotFoundException and the app crashes on the very first
        # launch. This is the exact bug that crashed the first build this
        # workflow ever published to Internal Testing (versionCode 1,
        # reproduced and confirmed on a real device). flutter-ci.yml carries
        # the identical fix for the identical reason.
        run: |
          old_kt_dir="android/app/src/main/kotlin/com/shahzebrahman/tyre_pulse"
          new_kt_dir="android/app/src/main/kotlin/com/shahzebrahman/tyrepulse"
          if [ -d "$old_kt_dir" ]; then
            mkdir -p "$new_kt_dir"
            for f in "$old_kt_dir"/*; do
              sed 's/com\.shahzebrahman\.tyre_pulse/com.shahzebrahman.tyrepulse/' \
                "$f" > "$new_kt_dir/$(basename "$f")"
            done
            rm -rf "$old_kt_dir"
          fi

      - name: Reconstruct the release keystore from secrets
        run: |
          # `tr -d '[:space:]'` first: a base64 secret pasted through a browser
          # UI can pick up an embedded newline or trailing whitespace, which
          # `base64 -d` would otherwise fold into the decoded bytes and
          # corrupt the keystore (this is exactly what happened the first
          # time this workflow ran - "Tag number over 30 is not supported"
          # is DER-parsing-speak for "this file's bytes are not a valid
          # keystore").
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Verify the reconstructed keystore is readable
        # Fails fast, with a clear message, rather than 6+ minutes into a
        # release build only to fail at the final signing step on a
        # keystore that was never valid to begin with.
        run: |
          keytool -list \
            -keystore android/app/release.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          || { echo "::error::The reconstructed keystore is not readable - ANDROID_KEYSTORE_BASE64 is likely corrupted (a stray newline/whitespace from copy-paste is the usual cause). Re-copy it from a single unbroken line and re-add the secret."; exit 1; }

      - name: Wire the signing config into build.gradle.kts
        # Written directly rather than patched with a regex on freshly
        # generated boilerplate - that boilerplate's exact comment text is
        # not a contract Flutter guarantees to keep stable across versions,
        # and a regex that silently fails to match would leave the release
        # build signed with the DEBUG key without erroring. This is the
        # same content already built and verified locally for this app.
        run: |
          cat > android/app/build.gradle.kts <<'EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.shahzebrahman.tyrepulse"
              compileSdk = 37
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.shahzebrahman.tyrepulse"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          cat android/app/build.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed release AAB
        # main.dart / app_config.dart validate SUPABASE_URL and
        # SUPABASE_ANON_KEY at startup and, if either is missing, render a
        # deliberate "This app is not set up correctly" screen instead of
        # crashing - which is exactly what the first build out of this fixed
        # workflow did (versionCode 2, confirmed on a real device): it opened
        # cleanly (the MainActivity fix above worked) straight into that
        # screen, because this step never passed either value in. The
        # anon/publishable key is safe to embed in a compiled binary - RLS is
        # the real access boundary, the same reasoning already written out in
        # app_config.dart and already acted on in build-native-android.yml
        # and mobile/eas.json, both of which ship this exact literal key.
        # SUPABASE_ANON_KEY_PROD is read here (not a new secret) so a future
        # key rotation only has to touch one place across every workflow.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jhssdmeruxtrlqnwfksc.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD || 'sb_publishable_UDEH7EeHA9S5-NNu4T-9Ug_R60IinrW' }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=staging

      - name: Publish to Play Console Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_F }}
          packageName: com.shahzebrahman.tyrepulse
          releaseFiles: tyre_pulse_flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
