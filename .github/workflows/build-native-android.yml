name: Build and Submit Native Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

# Least privilege: this workflow no longer pushes anything back to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build & Sign Native AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # SIGNING KEY
      #
      # This step used to generate a keystore when one was missing and then `git push`
      # it to main. Two things were wrong with that:
      #   1. It committed an app SIGNING KEY to the repository. Anyone with repo access
      #      could then sign a build that Android accepts as an update to this app.
      #   2. A freshly generated key is a DIFFERENT key. Play rejects an upload signed
      #      with anything but the established one, so the "helpful" fallback could only
      #      ever produce an artifact that cannot be shipped.
      #
      # Signing uses private secrets only. The historical committed upload key
      # still requires rotation through Play Console before another release.
      - name: Load signing keystore
        id: load_keystore
        working-directory: tyre_pulse_app
        env:
          KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_SECRET:-}" ]; then
            echo "Using keystore from ANDROID_KEYSTORE_BASE64 secret."
            echo "keystore_base64=${KEYSTORE_SECRET}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No signing key available. Set the ANDROID_KEYSTORE_BASE64 secret (base64 of your upload keystore)."
            echo "A key is NOT generated here on purpose: a new key produces an artifact Play will reject, which looks like a build problem rather than a signing one."
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        working-directory: tyre_pulse_app
        run: chmod +x gradlew

      - name: Build Release Bundle (AAB)
        working-directory: tyre_pulse_app
        # local.properties is untracked, so CI never had one and the build fell back to
        # the literal "MISSING_KEY_PROD". That produced a signed, published AAB whose
        # every request returned 401 - login included - while the build reported
        # success. The key is passed through the environment now; build.gradle.kts
        # reads local.properties first, then this, then the publishable default, and
        # FAILS a release build if what it ends up with is not a usable key.
        #
        # Setting the secret is optional: it exists so a future key rotation does not
        # need a commit. Without it the publishable default is used, which is the same
        # key the deployed web bundle already ships.
        env:
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: ./gradlew bundleProdRelease

      - name: Sign Android App Bundle (AAB)
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: tyre_pulse_app/app/build/outputs/bundle/prodRelease
          signingKeyBase64: ${{ steps.load_keystore.outputs.keystore_base64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}


      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-app-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Publish to Google Play (Internal Track)
        if: startsWith(github.ref, 'refs/tags/native-v') || github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_NATIVE }}
          # NOTE: This is the NATIVE app — separate listing from the production Expo app
          # Production app ID: com.shahzebrahman.tyrepulseinspector  (DO NOT TOUCH)
          # Native app ID:     com.shahzebrahman.tyrepulse.native     (this workflow)
          packageName: com.shahzebrahman.tyrepulse.native
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal
          status: completed

